<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Administrar · Sara Boutique</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap">
<style>
:root{color-scheme:light;--rose:#b9737f;--rl:#f3dfe2;--ink:#3b2a2d;--mut:#8a7478;--line:#efdfe1;--gold:linear-gradient(135deg,#8a5f2a,#c9954f 22%,#f0d4a0 42%,#c08a46 62%,#9a6a30 82%,#e2b97a)}
*{box-sizing:border-box;margin:0}body{font-family:Jost,system-ui,sans-serif;background:#fff;color:var(--ink);padding-bottom:40px}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:2px solid #c9954f}
header img{width:44px;height:44px;border-radius:50%}header h1{font-size:19px;flex:1}
main{max-width:640px;margin:0 auto;padding:14px}
.card{border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;background:#fff}
h2{font-size:18px;margin-bottom:6px}label{display:block;font-size:13px;color:var(--mut);margin:12px 0 5px}
input,select{width:100%;border:1px solid var(--line);background:#fbf4f4;border-radius:12px;padding:12px;font:inherit;color:var(--ink)}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 16px;font-weight:600;background:var(--rl);color:#9a5662}
.go{width:100%;margin-top:14px;background:var(--gold);color:#3a2410}.go:disabled{opacity:.6}
.m{font-size:13px;margin-top:8px;min-height:16px}
.row{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.row img{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--rl);flex:none}
.mid{flex:1;min-width:0}.mid b{display:block;font-weight:500}.mid small{color:var(--mut)}
.th{width:56px;height:56px;border-radius:50%;background:var(--rl);display:grid;place-items:center;font-size:26px;flex:none}.drow img{border-radius:50%}.drow input{margin-top:6px;padding:8px;font-size:13px}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.ctl input{width:84px;padding:7px 9px}.ctl button{padding:7px 10px;font-size:12px}.del{color:#b3261e}
</style></head><body>
<header><img src="/img/logo.jpg" alt=""><h1>Administrar tienda</h1><button id="out" hidden>Salir</button></header>
<main>
<section id="login" class="card"><h2>Entrar</h2>
<label for="em">Correo</label><input id="em" type="email" autocomplete="username">
<label for="pw">Clave</label><input id="pw" type="password" autocomplete="current-password">
<div class="m" id="lm" role="alert"></div><button class="go" id="go">Entrar</button></section>
<section id="app" hidden>
<div class="card"><h2>Tasa BCV</h2><label for="rate">Bs por $1</label><input id="rate" type="number" step="0.01" min="0">
<div class="m" id="rm" role="status"></div><button class="go" id="rsave">Guardar tasa</button></div>
<div class="card"><h2>Nuevo producto</h2>
<label for="file">Foto</label><input id="file" type="file" accept="image/*">
<label for="name">Nombre</label><input id="name">
<label for="price">Precio en $</label><input id="price" type="number" step="0.01" min="0" inputmode="decimal">
<label for="dep">Departamento</label><select id="dep"></select>
<label for="cat">Categoría</label><select id="cat"></select>
<div class="m" id="sm" role="status"></div><button class="go" id="save">Subir producto</button></div>
<div class="card"><h2>Fotos de los departamentos</h2><div class="m" id="dm" role="status"></div><div id="deps"></div></div>
<div class="card"><h2>Tus productos</h2><div id="list"></div></div>
</section></main>
<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
var C=window.CONFIG,sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY),DEPS=[];
var $=function(i){return document.getElementById(i)};
function msg(id,t,ok){var e=$(id);e.textContent=t;e.style.color=ok?"#2e7d32":"#b3261e"}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function show(on){$("login").hidden=on;$("app").hidden=!on;$("out").hidden=!on;if(on)load()}
sb.auth.getSession().then(function(r){show(!!r.data.session)});
$("go").onclick=async function(){var r=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});if(r.error)msg("lm","Correo o clave incorrectos.");else show(true)};
$("out").onclick=async function(){await sb.auth.signOut();show(false)};
async function load(){
 var d=await sb.from("departments").select("id,name,emoji,image_url,categories(id,name,position)").order("position");DEPS=d.data||[];
 $("dep").innerHTML=DEPS.map(function(x,i){return '<option value="'+i+'">'+esc(x.name)+'</option>'}).join("");fillCats();depList();
 var s=await sb.from("settings").select("key,value");(s.data||[]).forEach(function(x){if(x.key==="tasa_bcv")$("rate").value=x.value});
 list()}
function depList(){$("deps").innerHTML=DEPS.map(function(d){return '<div class="row drow">'+(d.image_url?'<img src="'+esc(d.image_url)+'" alt="">':'<div class="th">'+esc(d.emoji)+'</div>')+'<div class="mid"><b>'+esc(d.name)+'</b><input type="file" accept="image/*" data-d="'+d.id+'" aria-label="Foto de '+esc(d.name)+'"></div></div>'}).join("")}
function cropSquare(f,size){return new Promise(function(res,rej){var u=URL.createObjectURL(f),im=new Image();im.onload=function(){try{var s=Math.min(im.width,im.height),c=document.createElement("canvas");c.width=c.height=size;c.getContext("2d").drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,size,size);URL.revokeObjectURL(u);c.toBlob(function(b){b?res(b):rej(new Error("No se pudo preparar la foto"))},"image/jpeg",.85)}catch(e){rej(e)}};im.onerror=function(){rej(new Error("No se pudo leer la foto"))};im.src=u})}
$("deps").onchange=async function(e){var id=e.target.dataset.d,f=e.target.files&&e.target.files[0];if(!id||!f)return;
 try{msg("dm","Subiendo foto…",true);var blob=await withTimeout(cropSquare(f,400),20000,"La foto tardó mucho en prepararse");
 var path="dept-"+id+"-"+Date.now()+".jpg",up=await withTimeout(sb.storage.from("products").upload(path,blob,{contentType:"image/jpeg"}),60000,"La subida tardó demasiado.");
 if(up.error)throw new Error("Foto: "+up.error.message);
 var url=sb.storage.from("products").getPublicUrl(path).data.publicUrl,r=await sb.from("departments").update({image_url:url}).eq("id",id);
 if(r.error)throw new Error(r.error.message);msg("dm","¡Foto actualizada!",true);load()}catch(err){msg("dm",err.message||String(err))}};
function fillCats(){var d=DEPS[$("dep").value]||{categories:[]};$("cat").innerHTML=d.categories.sort(function(a,b){return a.position-b.position}).map(function(c){return '<option value="'+c.id+'">'+esc(c.name)+'</option>'}).join("")}
$("dep").onchange=fillCats;
$("rsave").onclick=async function(){var v=parseFloat($("rate").value);if(!(v>0))return msg("rm","Escribe una tasa válida.");
 var r=await sb.from("settings").upsert([{key:"tasa_bcv",value:String(v)},{key:"tasa_fecha",value:new Date().toLocaleDateString("es-VE")}]);
 r.error?msg("rm","No se pudo guardar: "+r.error.message):msg("rm","Tasa actualizada.",true)};
function withTimeout(p,ms,txt){return Promise.race([p,new Promise(function(_,rej){setTimeout(function(){rej(new Error(txt))},ms)})])}
function resize(f){return new Promise(function(res,rej){var u=URL.createObjectURL(f),im=new Image();
 im.onload=function(){try{var s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(function(b){b?res(b):rej(new Error("No se pudo reducir la foto"))},"image/jpeg",.85)}catch(e){rej(e)}};
 im.onerror=function(){rej(new Error("No se pudo leer la foto"))};im.src=u})}
$("save").onclick=async function(){
 var f=$("file").files[0],n=$("name").value.trim(),p=parseFloat($("price").value),c=$("cat").value;
 if(!f||!n||!(p>=0)||!c)return msg("sm","Agrega la foto, el nombre y el precio.");
 $("save").disabled=true;
 try{
  msg("sm","1/3 Preparando la foto…",true);
  var blob;try{blob=await withTimeout(resize(f),20000,"La foto tardó mucho en prepararse")}catch(e){blob=f}
  msg("sm","2/3 Subiendo la foto ("+Math.round(blob.size/1024)+" KB)…",true);
  var path=Date.now()+"-"+Math.random().toString(36).slice(2,8)+".jpg";
  var up=await withTimeout(sb.storage.from("products").upload(path,blob,{contentType:"image/jpeg"}),60000,"La subida tardó demasiado. Revisa tu internet e intenta de nuevo.");
  if(up.error)throw new Error("Foto: "+up.error.message);
  var url=sb.storage.from("products").getPublicUrl(path).data.publicUrl;
  msg("sm","3/3 Guardando el producto…",true);
  var ins=await withTimeout(sb.from("products").insert({name:n,price_usd:p,image_url:url,category_id:c}),20000,"Guardar tardó demasiado.");
  if(ins.error)throw new Error("Producto: "+ins.error.message);
  $("name").value="";$("price").value="";$("file").value="";msg("sm","¡Producto subido!",true);list()
 }catch(e){msg("sm",e.message||String(e))}
 $("save").disabled=false}
async function list(){
 var r=await sb.from("products").select("id,name,price_usd,image_url,in_stock,categories(name,departments(name))").order("created_at",{ascending:false});
 $("list").innerHTML=(r.data||[]).map(function(p){var c=p.categories||{};
  return '<div class="row"><img src="'+esc(p.image_url)+'" alt=""><div class="mid"><b>'+esc(p.name)+'</b><small>'+esc((c.departments||{}).name)+' › '+esc(c.name)+(p.in_stock?'':' · AGOTADO')+'</small><div class="ctl">$ <input type="number" step="0.01" min="0" value="'+p.price_usd+'" data-p="'+p.id+'" aria-label="Precio"><button data-s="'+p.id+'" data-v="'+p.in_stock+'">'+(p.in_stock?'Marcar agotado':'Marcar disponible')+'</button><button class="del" data-x="'+p.id+'">Borrar</button></div></div></div>'}).join("")||"<p>Aún no hay productos.</p>"}
$("list").onchange=async function(e){var id=e.target.dataset.p,v=parseFloat(e.target.value);if(!id||!(v>=0))return;await sb.from("products").update({price_usd:v}).eq("id",id)};
$("list").onclick=async function(e){var b=e.target.closest("button");if(!b)return;
 if(b.dataset.s){await sb.from("products").update({in_stock:b.dataset.v!=="true"}).eq("id",b.dataset.s);list()}
 else if(b.dataset.x&&confirm("¿Borrar este producto?")){await sb.from("products").delete().eq("id",b.dataset.x);list()}};
</script></body></html>
